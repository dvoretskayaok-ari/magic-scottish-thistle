<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puppies of dog kennel Magic Scottish Thistle</title>
    <link rel="icon" type="image/x-icon" href="../image/sumbol.jpeg">
    <link rel="stylesheet" href="../style/style.css">
</head>
<body class="container">
    <header class="menu">
        <hr>
        <img src="../image/sumbol.jpeg" alt="Символ розплідника" width="30" height="30">
        <a href="../index.html">Головна сторінка |</a>
        <a href="contacts.html" target="_blank">Контакти розплідника |</a>
        <a href="puppies.html" target="_blank">Наші цуценята |</a>
        <hr>
    </header>
    <main>
        <h1 class="section-title" id="top">Наші цуценята</h1>
        <hr>
        <form class="accent">
            <p><b>Для бронювання цуценя заповніть будь-ласка наступну форму:</b></p>
            <label for="name">Ім'я:</label>
            <input type="text" id="name" name="name" required>
            <label for="age">Вік</label>
            <input type="number" id="age" name="age" min="1" max="100" required>
            <label for="email">Електронна пошта:</label>
            <input type="email" id="email" name="email" required>
            <label for="phone">Номер телефону</label>
            <input type="tel" id="phone" name="phone" placeholder="+380677786229" required>
            <hr>
            <label for="puppies">Оберіть варіант:</label>
            <select id="puppies" name="puppies">
                <option value="ase boss"><span>Ase Boss</span></option>
                <option value="asterrix"><span>Asterrix</span></option>
                <option value="ariel"><span>Ariel</span></option>
                <option value="arwen"><span>Arwen</span></option>
                <option value="assol"><span>Assol</span></option>
            </select>
            <label for="message">Повідомлення:</label>
            <textarea id="message" name="message" rows="3" cols="30"></textarea>
            <button type="submit">Send</button>
        </form>
        <hr>
        <h2 class="section-title2">Цуценята, які народились 16.04.2026</h2>
        <div class="puppies">
            <figure>
                <img src="../image/boss.jpeg" alt="цуценя Boss">
                <figcaption><span>Ase Boss Magic Scottish Thistle</span></figcaption>
            </figure>
            <figure>
                <img src="../image/asterrix.jpeg" alt="цуценя Asterrix">
                <figcaption><span>Asterrix Marryblade Magic Scottish Thistle</span></figcaption>
            </figure>
            <figure>
                <img src="../image/ariel.jpeg" alt="цуценя Ariel">
                <figcaption><span>Ariel Magic Scottish Thistle</span></figcaption>
            </figure>
            <figure>
                <img src="../image/arwen.jpeg" alt="цуценя Arwen">
                <figcaption><span>Arwen Magic Scottish Thistle</span></figcaption>
            </figure>
            <figure>
                <img src="../image/assol.jpeg" alt="цуценя Assol">
                <figcaption><span>Assol Magic Scottish Thistle</span></figcaption>
            </figure>
        </div>
        <h2 class="section-title2">Батько та цуценята</h2>
        <div class="video">
            <video width="640" height="480" controls>
                <source src="../video/video.mp4" type="video/mp4">
            </video>
        </div>
        <hr>
        <a href="#top">Повернутись до початку сторінки</a>
    </main>
</body>
</html>
